[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-ai"
version = "0.1.0"
description = "Coherence layer for AI-generated structured content — world bibles, skeleton-driven generation, and validation pipelines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Demi-Build" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
huggingface = [
    "torch",
    "transformers",
    "accelerate",
    "sentencepiece",
]
images = ["fal-client", "pillow"]
images-local = ["diffusers", "pillow", "torch"]
audio = ["google-genai", "elevenlabs"]
cli = ["typer[all]>=0.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Demi-Build/canon-ai"
Repository = "https://github.com/Demi-Build/canon-ai"
Issues = "https://github.com/Demi-Build/canon-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
