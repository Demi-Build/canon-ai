            - generic [ref=e374]: new
            - text: Level editor
          - paragraph [ref=e375]: The map is the surface. Paint tile types, place and move enemies, items and checkpoints, resize the grid, and save the batch with ⌘S. Three render modes (Blocks / Art / Overlay) all drive the same edits. Right-click always erases. Tool rail, bottom dock, minimap, audio lane, bounds and rulers — all toggleable, and the floating panels remember where you put them.
      - generic [ref=e376]:
        - generic [ref=e377]: v0.2
        - generic [ref=e378]:
          - heading "new World map" [level=4] [ref=e379]:
            - generic [ref=e380]: new
            - text: World map
          - paragraph [ref=e381]: Place levels, group them into areas, wire typed paths (two-way, one-way, conditional, planned) and drop path stops. Two canvas treatments over one graph — Schematic for authoring, Overworld for how it reads in game. The map is recomputed from the seed on every run, so anything you place is written as a durable override; the header tracks how many human edits it's carrying and can hand them back.
