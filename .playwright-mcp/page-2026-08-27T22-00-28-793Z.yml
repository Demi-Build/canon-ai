          - paragraph [ref=e79]: The map is the surface. Paint tile types, place and move enemies, items and checkpoints, resize the grid, and save the batch with ⌘S. Three render modes (Blocks / Art / Overlay) all drive the same edits. Right-click always erases. Tool rail, bottom dock, minimap, audio lane, bounds and rulers — all toggleable, and the floating panels remember where you put them.
