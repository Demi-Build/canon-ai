            - text: World map
          - paragraph [ref=e85]: Place levels, group them into areas, wire typed paths (two-way, one-way, conditional, planned) and drop path stops. Two canvas treatments over one graph — Schematic for authoring, Overworld for how it reads in game. The map is recomputed from the seed on every run, so anything you place is written as a durable override; the header tracks how many human edits it's carrying and can hand them back.
