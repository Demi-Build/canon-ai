        - generic [ref=e248]:
          - heading "new Level editor" [level=4] [ref=e249]:
            - generic [ref=e250]: new
            - text: Level editor
          - paragraph [ref=e251]: The map is the surface. Paint tile types, place and move enemies, items and checkpoints, resize the grid, and save the batch with ⌘S. Three render modes (Blocks / Art / Overlay) all drive the same edits. Right-click always erases. Tool rail, bottom dock, minimap, audio lane, bounds and rulers — all toggleable, and the floating panels remember where you put them.
      - generic [ref=e252]:
        - generic [ref=e253]: v0.2
        - generic [ref=e254]:
          - heading "new World map" [level=4] [ref=e255]:
            - generic [ref=e256]: new
            - text: World map
          - paragraph [ref=e257]: Place levels, group them into areas, wire typed paths (two-way, one-way, conditional, planned) and drop path stops. Two canvas treatments over one graph — Schematic for authoring, Overworld for how it reads in game. The map is recomputed from the seed on every run, so anything you place is written as a durable override; the header tracks how many human edits it's carrying and can hand them back.
