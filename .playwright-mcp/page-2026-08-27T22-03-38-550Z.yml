        - generic [ref=e384]:
          - heading "new Generation, without the freeze" [level=4] [ref=e385]:
            - generic [ref=e386]: new
            - text: Generation, without the freeze
          - paragraph [ref=e387]: New projects, new levels, regenerate a layout blind, or Improve one with the LLM looking at what's there. Everything runs as a background job — the queue tray shows what ran, what it cost, how long it took, and whether it actually changed anything. Generators default to $0; turning one up shows a live estimate and asks before it spends.
